# Fuzzel 极简黑白灰配置
[main]
sort-result=no

# 基础设置
font=monospace:size=12
icons-enabled=yes
fuzzy=yes
show-actions=no

# 启动器位置与尺寸
anchor=center
width=40
lines=10
horizontal-pad=18
vertical-pad=8
inner-pad=6

# 搜索行为
exit-on-keyboard-focus-loss=no

# 黑白灰配色（RGBA）
[colors]
background=000000ee
text=ffffffff
match=bdbdbdff
prompt=ccccccff
placeholder=888888ff
input=ffffffff
selection=303030ff
selection-text=ffffffff
selection-match=ddddddff
counter=888888ff
border=666666ff

# 细边框与轻微圆角
[border]
width=1
radius=6

# 键位
[key-bindings]
cancel=Escape Control+g
execute=Return KP_Enter
prev=Up Control+p
next=Down Control+n
prev-page=Page_Up
next-page=Page_Down
